name: SHOPEE API - TESTE REAL BR (AUTO)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/shopee-api-smoke-test.yml

permissions:
  contents: read

jobs:
  product-query-test:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar produtos reais na Shopee GraphQL
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import time
          import urllib.request
          import urllib.error

          app_id = os.environ.get("SHOPEE_APP_ID", "").strip()
          secret = os.environ.get("SHOPEE_APP_SECRET", "").strip()
          if not app_id or not secret:
              raise SystemExit("Falha: SHOPEE_APP_ID ou SHOPEE_APP_SECRET ausente nos GitHub Secrets.")

          endpoint = "https://open-api.affiliate.shopee.com.br/graphql"
          query = """{
            productOfferV2(keyword: "fone bluetooth", sortType: 1, page: 1, limit: 5) {
              nodes {
                productName
                imageUrl
                productLink
                offerLink
                priceMin
                priceMax
                priceDiscountRate
                commissionRate
                sales
                shopName
              }
              pageInfo { page limit hasNextPage }
            }
          }"""
          payload = json.dumps({"query": query}, separators=(",", ":"))
          timestamp = str(int(time.time()))
          signature = hashlib.sha256((app_id + timestamp + payload + secret).encode("utf-8")).hexdigest()
          authorization = f"SHA256 Credential={app_id}, Timestamp={timestamp}, Signature={signature}"

          req = urllib.request.Request(
              endpoint,
              data=payload.encode("utf-8"),
              headers={"Authorization": authorization, "Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read().decode("utf-8", errors="replace")
                  parsed = json.loads(raw)
                  print("HTTP:", response.status)
                  if parsed.get("errors"):
                      print("GraphQL retornou erros:")
                      for error in parsed["errors"]:
                          print("-", error.get("message", "Erro GraphQL sem mensagem"))
                      raise SystemExit(1)
                  data = parsed.get("data") or {}
                  result = data.get("productOfferV2") or {}
                  nodes = result.get("nodes") or []
                  print("=== TESTE REAL SHOPEE BR - REVISAO AUTOMATICA ===")
                  print("Commit/branch:", os.environ.get("GITHUB_SHA", "unknown"), os.environ.get("GITHUB_REF", "unknown"))
                  print("Consulta GraphQL de produtos: OK")
                  print("Produtos retornados:", len(nodes))
                  print("pageInfo:", result.get("pageInfo"))
                  if not nodes:
                      raise SystemExit("Consulta autenticou, mas não retornou produtos. Teste de dados falhou.")
                  first = nodes[0]
                  print("=== PRODUTOS RETORNADOS ===")
                  for index, product in enumerate(nodes, 1):
                      print(f"Produto {index}: {product.get('productName', '(sem nome)')}")
                      print(f"  Preço: {product.get('priceMin')} - {product.get('priceMax')}")
                      print(f"  Comissão: {product.get('commissionRate')} | Vendas: {product.get('sales')}")
                      print(f"  Imagem: {product.get('imageUrl')}")
                      print(f"  Link afiliado: {product.get('offerLink')}")
                  print("=== FIM DA LISTA ===")
                  print("Produto exemplo:", first.get("productName", "(sem nome)"))
                  print("Campos preenchidos no primeiro produto:", [k for k in ("imageUrl", "productLink", "offerLink", "priceMin", "priceMax", "priceDiscountRate", "commissionRate", "sales", "shopName") if first.get(k) not in (None, "")])
                  if not first.get("imageUrl"):
                      print("AVISO: primeiro produto não possui imageUrl.")
                  if not first.get("offerLink"):
                      print("AVISO: primeiro produto não possui offerLink de afiliado.")
                  print("Teste de consulta de produtos concluído.")
          except urllib.error.HTTPError as e:
              body = e.read().decode("utf-8", errors="replace")
              print("HTTP:", e.code)
              try:
                  parsed = json.loads(body)
                  for error in parsed.get("errors", []):
                      print("-", error.get("message", "Erro API"))
              except Exception:
                  print("A API respondeu com erro HTTP; corpo não exibido.")
              raise SystemExit(1)
          except urllib.error.URLError as e:
              print("Falha de conexão:", e.reason)
              raise SystemExit(1)
          PY
