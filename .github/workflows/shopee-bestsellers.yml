name: Shopee - catálogo diário e lote de até 500

on:
  push:
    branches: [main]
    paths:
      - "scripts/collect_shopee_bestsellers.py"
      - "scripts/build_catalog_pages.py"
      - ".github/workflows/shopee-bestsellers.yml"
  # Three daily windows provide automatic retries if GitHub delays or drops a scheduled event.
  # Times are UTC: 08:45, 14:45 and 20:45 in America/Sao_Paulo.
  schedule:
    - cron: "45 11,17,23 * * *"
  workflow_dispatch:
    inputs:
      target_products:
        description: "Quantidade máxima de produtos para esta coleta"
        required: true
        type: choice
        options: ["15", "100", "500"]
        default: "500"
      allow_supplemental:
        description: "Permite adicionar um lote extra mesmo que a coleta diária já tenha ocorrido"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: shopee-daily-bestsellers
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout do catálogo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar os produtos mais vendidos na Shopee
        id: collector
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          SHOPEE_TARGET_PRODUCTS: ${{ github.event_name == 'workflow_dispatch' && inputs.target_products || (contains(github.event.head_commit.message || '', '[bulk-500]') && '500' || (contains(github.event.head_commit.message || '', '[bulk-100]') && '100' || '15')) }}
          SHOPEE_ALLOW_SUPPLEMENTAL: ${{ (github.event_name == 'workflow_dispatch' && inputs.allow_supplemental) || contains(github.event.head_commit.message || '', '[bulk-500]') || contains(github.event.head_commit.message || '', '[bulk-100]') }}
        run: python scripts/collect_shopee_bestsellers.py

      - name: Gerar HTML estático, páginas de categoria e sitemap
        run: python scripts/build_catalog_pages.py

      - name: Salvar catálogo e relatório diário
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shopee-products.json data/shopee-bestsellers-report.json index.html sitemap.xml achados/
          if git diff --cached --quiet; then
            echo "Nenhum produto novo ou alteração no relatório."
          else
            git commit -m "Atualiza catálogo Shopee em lote [bulk-500]"
            git push
          fi

      # GitHub Pages already deploys automatically from the main branch on every push.
      # A second manual upload/deploy here was redundant and produced intermittent artifact-not-found errors.
